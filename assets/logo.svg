<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background dengan rounded corners -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="circleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f2ea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="playGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fe2c55;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff0066;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1024" height="1024" rx="220" fill="url(#bgGradient)"/>
  
  <!-- Glow effect circle -->
  <circle cx="512" cy="420" r="280" fill="url(#circleGradient)" opacity="0.15" filter="blur(40px)"/>
  
  <!-- Main circular badge -->
  <circle cx="512" cy="420" r="220" fill="url(#circleGradient)" opacity="0.9"/>
  
  <!-- Inner circle (phone/screen representation) -->
  <rect x="362" y="290" width="300" height="260" rx="40" fill="#1a1a1a" opacity="0.8"/>
  
  <!-- Play button icon (TikTok style) -->
  <path d="M 470 340 L 470 460 L 570 400 Z" fill="url(#playGradient)"/>
  
  <!-- Sparkle/Star effects -->
  <circle cx="380" cy="320" r="12" fill="#00f2ea" opacity="0.8"/>
  <circle cx="644" cy="340" r="10" fill="#fe2c55" opacity="0.8"/>
  <circle cx="420" cy="520" r="8" fill="#ffffff" opacity="0.6"/>
  <circle cx="600" cy="500" r="14" fill="#00f2ea" opacity="0.7"/>
  
  <!-- Hashtag symbol -->
  <g transform="translate(590, 360)">
    <rect x="0" y="10" width="8" height="50" rx="2" fill="#00f2ea" opacity="0.5" transform="rotate(15 4 35)"/>
    <rect x="20" y="10" width="8" height="50" rx="2" fill="#00f2ea" opacity="0.5" transform="rotate(15 24 35)"/>
    <rect x="-5" y="20" width="40" height="6" rx="2" fill="#00f2ea" opacity="0.5"/>
    <rect x="-5" y="38" width="40" height="6" rx="2" fill="#00f2ea" opacity="0.5"/>
  </g>
  
  <!-- Arrow pointing up (FYP concept) -->
  <g transform="translate(420, 360)">
    <path d="M 0 30 L 15 10 L 30 30 L 20 30 L 20 50 L 10 50 L 10 30 Z" fill="#fe2c55" opacity="0.7"/>
  </g>
  
  <!-- Text: FYP -->
  <text x="512" y="680" font-family="Arial, sans-serif" font-size="140" font-weight="900" fill="#00f2ea" text-anchor="middle" letter-spacing="-5">
    FYP
  </text>
  
  <!-- Text: HELPER -->
  <text x="512" y="780" font-family="Arial, sans-serif" font-size="80" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    HELPER
  </text>
  
  <!-- Decorative lines -->
  <line x1="240" y1="800" x2="400" y2="800" stroke="#00f2ea" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <line x1="624" y1="800" x2="784" y2="800" stroke="#00f2ea" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  
  <!-- Rocket emoji style icon (represents boost to FYP) -->
  <g transform="translate(740, 640)">
    <ellipse cx="0" cy="0" rx="28" ry="35" fill="#fe2c55"/>
    <ellipse cx="0" cy="-8" rx="20" ry="20" fill="#ff6b8a"/>
    <polygon points="-15,10 -25,30 -10,20" fill="#00f2ea"/>
    <polygon points="15,10 25,30 10,20" fill="#00f2ea"/>
    <circle cx="0" cy="-5" r="8" fill="#ffffff" opacity="0.8"/>
  </g>
  
  <!-- TikTok style note icon -->
  <g transform="translate(280, 640)">
    <circle cx="0" cy="15" r="18" fill="#00f2ea"/>
    <circle cx="15" cy="0" r="15" fill="#fe2c55" opacity="0.9"/>
    <rect x="-3" y="-20" width="6" height="25" rx="3" fill="#00f2ea"/>
  </g>
</svg>
